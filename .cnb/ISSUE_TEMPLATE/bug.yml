name: Bug
description: 反馈使用中遇到的问题（不会派开发助手）
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        这是问题反馈，不会自动派开发助手。要让开发助手改代码，请用「需求」表单。
  - type: markdown
    attributes:
      value: "## 应用版本"
      includeInBody: true
  - type: input
    attributes:
      label: 应用版本
      description: 设置页显示的版本号
      placeholder: 0.9.2-alpha.17
    validations:
      required: true
  - type: markdown
    attributes:
      value: "## 设备与系统"
      includeInBody: true
  - type: input
    attributes:
      label: 设备型号与 Android 版本
      placeholder: Galaxy S26，Android 16
    validations:
      required: true
  - type: markdown
    attributes:
      value: "## TUN / VPN 模式"
      includeInBody: true
  - type: dropdown
    attributes:
      label: 是否开着 TUN / VPN 模式
      options:
        - 开着
        - 关着
        - 不确定
    validations:
      required: true
  - type: markdown
    attributes:
      value: "## 复现步骤"
      includeInBody: true
  - type: textarea
    attributes:
      label: 复现步骤
      description: 每行一步
      placeholder: 从打开应用开始，每行一步
    validations:
      required: true
  - type: markdown
    attributes:
      value: "## 期望行为与实际行为"
      includeInBody: true
  - type: textarea
    attributes:
      label: 期望行为与实际行为
      placeholder: |
        期望：
        实际：
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        ## 日志
        **注意：贴日志前先删掉订阅链接、令牌、节点地址等敏感信息。**
      includeInBody: true
  - type: textarea
    attributes:
      label: 日志
      description: 贴日志内容，不要传文件。先删掉订阅链接、令牌、节点地址等敏感信息
      placeholder: 可留空
