.mirror: &mirror
  name: Mirror signed GitHub release to CNB
  runner: { cpus: 1 }
  docker:
    image: python:3.12-slim
  lock:
    key: flclash-release-mirror
    wait: true
    cancel-in-wait: true
  stages:
    - name: Verify and publish identical APK
      script: python3 .cnb/mirror-release.py
      timeout: 10m

.controller-wake: &controller-wake
  name: Wake task controller
  runner: { cpus: 1 }
  docker:
    image: python:3.12-slim
  stages:
    - name: Dispatch reconciliation from trusted branch
      imports: https://cnb.cool/507space/FlClash-alpha-secrets/-/blob/main/github-dispatch.yml
      script: python3 .automation/wake.py
      timeout: 2m
main:
  pull_request:
    - name: Dependency vulnerability gate
      runner: { cpus: 1 }
      stages:
        - name: Block new high-risk dependency vulnerabilities
          image: cnbcool/sca-vulnerability:latest
          settings:
            failOnSeverity: high
    - name: Go dependency regression tests
      runner: { cpus: 2 }
      docker:
        image: golang:1.26.8
      stages:
        - name: Verify core with resolved dependencies
          script: |
            git submodule update --init --recursive
            cd core
            CGO_ENABLED=0 go test . ./internal/logstore
            CGO_ENABLED=0 go vet . ./internal/logstore
          timeout: 15m
        - name: Rescan actual versions and verify repaired dependency
          script: |
            cd "$CNB_BUILD_WORKSPACE"
            apt-get update -qq
            apt-get install -y --no-install-recommends python3
            case "$CNB_PULL_REQUEST_BRANCH" in
              security/group-*|refs/heads/security/group-*)
                baseline_root=$(mktemp -d /tmp/flclash-security-base.XXXXXX)
                git clone --no-checkout --shared "$CNB_BUILD_WORKSPACE" "$baseline_root"
                git -C "$baseline_root" checkout --detach "$CNB_PULL_REQUEST_TARGET_SHA"
                git -C "$baseline_root" submodule update --init --recursive
                python3 .automation/security_scan.py "$baseline_root" /tmp/security-baseline.json
                python3 .automation/security_scan.py . /tmp/security-pr-report.json --baseline /tmp/security-baseline.json --repair-branch "$CNB_PULL_REQUEST_BRANCH"
                ;;
              *) python3 .automation/security_scan.py . /tmp/security-pr-report.json --repair-branch "$CNB_PULL_REQUEST_BRANCH" ;;
            esac
          timeout: 10m
    - name: Flutter and Android requirement tests
      runner: { cpus: 4 }
      docker:
        image: ubuntu:24.04
        volumes:
          - /root/.pub-cache:copy-on-write
          - /root/.gradle:copy-on-write
          - /root/go:copy-on-write
          - /root/.cache/go-build:copy-on-write
      stages:
        - name: Reuse toolchain image
          if: 'case "$CNB_PULL_REQUEST_BRANCH" in automation/req-*) exit 0 ;; *) exit 1 ;; esac'
          type: docker:cache
          options:
            dockerfile: .cnb/Dockerfile
            versionBy: .cnb/Dockerfile
          exports:
            name: TOOLCHAIN_IMAGE
        - name: Test Flutter and Android changes
          if: 'case "$CNB_PULL_REQUEST_BRANCH" in automation/req-*) exit 0 ;; *) exit 1 ;; esac'
          image: $TOOLCHAIN_IMAGE
          timeout: 45m
          script: |
            changed=$(git diff --name-only "$CNB_PULL_REQUEST_TARGET_SHA" HEAD || true)
            printf '%s\n' "$changed" | grep -Eq '^(lib/|android/|test/|pubspec\.yaml|analysis_options\.yaml)' || { echo 'No Flutter or Android changes'; exit 0; }
            git submodule update --init --recursive
            flutter pub get
            flutter analyze --no-fatal-infos
            cp pubspec.yaml /tmp/flclash-pubspec.yaml
            trap 'cp /tmp/flclash-pubspec.yaml pubspec.yaml' EXIT
            sed -i 's/build_assets: true/build_assets: false/g' pubspec.yaml
            flutter test --reporter expanded
    - name: Rust dependency regression tests
      runner: { cpus: 2 }
      docker:
        image: rust:1.95-bookworm
      stages:
        - name: Verify desktop helper and Rust API
          script: |
            apt-get update -qq
            apt-get install -y --no-install-recommends libx11-dev libxkbcommon-dev
            cargo test --locked --manifest-path services/helper/Cargo.toml
            cargo test --locked --manifest-path plugins/rust_api/rust/Cargo.toml
          timeout: 20m
  push:
    - *mirror
  "crontab: */15 * * * *":
    - *mirror
$:
  issue.open:
    - name: Wake task controller
      runner: { cpus: 1 }
      docker:
        image: python:3.12-slim
      stages:
        - name: Bridge issue open into a comment wake
          script: python3 .automation/wake.py
          timeout: 2m
  issue.comment:
    - name: Wake GitHub controller after approval or review
      runner: { cpus: 1 }
      docker:
        image: python:3.12-slim
      stages:
        - name: Validate comment and request controller run
          imports: https://cnb.cool/507space/FlClash-alpha-secrets/-/blob/main/github-dispatch.yml
          script: python3 .automation/wake.py
          timeout: 2m
  pull_request.target:
    - *controller-wake
    - name: Paired review gate
      runner: { cpus: 1 }
      docker:
        image: python:3.12-slim
      stages:
        - name: Require both independent reviews for current PR
          script: python3 .automation/reviews.py cnb-gate
          timeout: 32m
    - name: Wake controller after checks
      runner: { cpus: 1 }
      docker:
        image: python:3.12-slim
      stages:
        - name: Dispatch reconciliation once every check passes
          imports: https://cnb.cool/507space/FlClash-alpha-secrets/-/blob/main/github-dispatch.yml
          script: python3 .automation/wake.py settled
          timeout: 55m
  api_trigger:
    - *mirror
  web_trigger:
    - *mirror
  api_trigger_fallback:
    - name: Compile fallback artifact without personal signing key
      runner: { cpus: 8 }
      docker:
        build: .cnb/Dockerfile
        volumes:
          - /root/.pub-cache:copy-on-write
          - /root/.gradle:copy-on-write
          - /root/go:copy-on-write
          - /root/.cache/go-build:copy-on-write
      lock:
        key: flclash-fallback-build
        wait: true
      stages:
        - name: Verify source and prepare
          script: |
            test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
            bash .cnb/run.sh prepare
          timeout: 20m
        - name: Analyze and test
          script: bash .cnb/run.sh check
          timeout: 20m
        - name: Compile temporary artifact
          script: |
            build=$(python3 -c "import json; print(json.load(open('.github/release.json'))['build'])")
            flutter build apk --release --target-platform android-arm64 --dart-define=APP_ENV=stable --build-number "$build"
            python3 .automation/fallback.py produce
          timeout: 45m
  api_trigger_permissions:
    - name: Verify temporary Release permissions
      runner: { cpus: 1 }
      docker:
        image: python:3.12-slim
      stages:
        - script: python3 .automation/release_permission_probe.py
          timeout: 2m
  issue.comment@npc:
    - name: Project NPC
      runner: { cpus: 2 }
      docker:
        image: cnbcool/default-npc:latest
        volumes:
          - /root/.pub-cache:copy-on-write
          - /root/.gradle:copy-on-write
          - /root/go:copy-on-write
          - /root/.cache/go-build:copy-on-write
      stages:
        - name: Reuse toolchain image
          if: '[ "$CNB_NPC_NAME" = "开发助手" ]'
          type: docker:cache
          options:
            dockerfile: .cnb/Dockerfile
            versionBy: .cnb/Dockerfile
          exports:
            name: TOOLCHAIN_IMAGE
        - name: DeepSeek development
          if: '[ "$CNB_NPC_NAME" = "开发助手" ]'
          image: $TOOLCHAIN_IMAGE
          type: npc:go
          options:
            maxTurns: 240
            model: deepseek-v4.1-flash
            contextWindow: 1m
            thinkingLevel: 'off'
            supportImage: true
        - name: DeepSeek primary review
          if: '[ "$CNB_NPC_NAME" != "开发助手" ] && [ "$CNB_NPC_NAME" != "GLM复核助手" ]'
          type: npc:go
          options:
            maxTurns: 60
            model: deepseek-v4.1-flash
            contextWindow: 1m
            thinkingLevel: 'off'
            supportImage: true
        - name: GLM independent review
          if: '[ "$CNB_NPC_NAME" = "GLM复核助手" ]'
          type: npc:go
          timeout: 10m
          options:
            model: glm-5.3-flash
            contextWindow: 128k
            maxTurns: 60
            maxTokens: 48k
            thinkingLevel: medium
            supportImage: true
  pull_request.comment@npc:
    - name: Project NPC review
      runner: { cpus: 2 }
      docker:
        image: cnbcool/default-npc:latest
        volumes:
          - /root/.pub-cache:copy-on-write
          - /root/.gradle:copy-on-write
          - /root/go:copy-on-write
          - /root/.cache/go-build:copy-on-write
      stages:
        - name: Reuse toolchain image
          if: '[ "$CNB_NPC_NAME" = "开发助手" ]'
          type: docker:cache
          options:
            dockerfile: .cnb/Dockerfile
            versionBy: .cnb/Dockerfile
          exports:
            name: TOOLCHAIN_IMAGE
        - name: DeepSeek development
          if: '[ "$CNB_NPC_NAME" = "开发助手" ]'
          image: $TOOLCHAIN_IMAGE
          type: npc:go
          options:
            maxTurns: 240
            model: deepseek-v4.1-flash
            contextWindow: 1m
            thinkingLevel: 'off'
            supportImage: true
        - name: DeepSeek primary review
          if: '[ "$CNB_NPC_NAME" != "开发助手" ] && [ "$CNB_NPC_NAME" != "GLM复核助手" ]'
          type: npc:go
          options:
            maxTurns: 60
            model: deepseek-v4.1-flash
            contextWindow: 1m
            thinkingLevel: 'off'
            supportImage: true
        - name: GLM independent review
          if: '[ "$CNB_NPC_NAME" = "GLM复核助手" ]'
          type: npc:go
          timeout: 10m
          options:
            model: glm-5.3-flash
            contextWindow: 128k
            maxTurns: 60
            maxTokens: 48k
            thinkingLevel: medium
            supportImage: true
  vscode:
    - name: FlClash cloud development
      runner: { cpus: 4 }
      docker:
        build: .cnb/Dockerfile
        volumes:
          - /root/.pub-cache:copy-on-write
          - /root/.gradle:copy-on-write
          - /root/go:copy-on-write
          - /root/.cache/go-build:copy-on-write
      services:
        - vscode
      stages:
        - name: Prepare development dependencies
          script: bash .cnb/run.sh prepare
          timeout: 20m
