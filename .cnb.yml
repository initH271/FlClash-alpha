.android: &android
  name: Android ARM64 build and benchmark
  runner:
    cpus: 8
  docker:
    build: .cnb/Dockerfile
    volumes:
      - /root/.pub-cache:copy-on-write
      - /root/.gradle:copy-on-write
      - /root/go:copy-on-write
      - /root/.cache/go-build:copy-on-write
  stages:
    - name: Dependencies and toolchain
      script: bash .cnb/run.sh prepare
      timeout: 20m
    - name: Analyze and focused tests
      script: bash .cnb/run.sh check
      timeout: 20m
    - name: Build and verify APK
      script: bash .cnb/run.sh build
      timeout: 45m
    - name: Save APK and timing report
      image: cnbcool/attachments:latest
      settings:
        attachments:
          - dist/*
        ttl: 14
main:
  push:
    - *android
$:
  api_trigger:
    - *android
  web_trigger:
    - *android
  pull_request:
    - name: Analyze and test PR
      runner: { cpus: 4 }
      docker:
        build: .cnb/Dockerfile
        volumes:
          - /root/.pub-cache:copy-on-write
          - /root/go:copy-on-write
          - /root/.cache/go-build:copy-on-write
      stages:
        - script: bash .cnb/run.sh prepare
          timeout: 20m
        - script: bash .cnb/run.sh check
          timeout: 20m
  vscode:
    - name: FlClash cloud development
      runner: { cpus: 4 }
      docker:
        build: .cnb/Dockerfile
        volumes:
          - /root/.pub-cache:copy-on-write
          - /root/.gradle:copy-on-write
          - /root/go:copy-on-write
          - /root/.cache/go-build:copy-on-write
      services:
        - vscode
      stages:
        - name: Prepare development dependencies
          script: bash .cnb/run.sh prepare
          timeout: 20m
