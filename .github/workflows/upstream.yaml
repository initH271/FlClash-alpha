name: Upstream decisions and build scheduling
on:
  schedule:
    - cron: '17 */6 * * *'
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options: [all, watch, approvals, scheduler]
        default: all
permissions:
  contents: write
  actions: write
  pull-requests: write
  issues: write
concurrency:
  group: flclash-upstream-controller
  cancel-in-progress: false
jobs:
  control:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Test trusted automation before mutations
        run: python3 -m unittest discover -s .automation -p 'test_*.py'
      - name: Set the commit identity
        id: identity
        run: |
          git config user.name FlClash-Automation
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
      - name: Notify new stable upstream release
        if: always() && steps.identity.outcome == 'success' && (github.event.schedule == '17 */6 * * *' || inputs.operation == 'all' || inputs.operation == 'watch')
        run: python3 .automation/control.py watch
      - name: Process owner approvals
        if: always() && steps.identity.outcome == 'success' && (github.event.schedule == '0 * * * *' || inputs.operation == 'all' || inputs.operation == 'approvals')
        run: python3 .automation/control.py approvals
      - name: Reuse artifacts of stopped release builds
        if: always() && steps.identity.outcome == 'success' && (github.event.schedule == '0 * * * *' || inputs.operation == 'all' || inputs.operation == 'scheduler')
        run: python3 .automation/scheduler.py
