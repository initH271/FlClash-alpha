name: Upstream decisions and build scheduling
on:
  schedule:
    - cron: '17 */6 * * *'
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options: [all, watch, sync, approvals, scheduler, preflight]
        default: all
permissions:
  contents: write
  actions: write
  pull-requests: write
  issues: write
concurrency:
  group: flclash-upstream-controller
  cancel-in-progress: false
jobs:
  control:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      CNB_AUTOMATION_TOKEN: ${{ secrets.CNB_AUTOMATION_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Test trusted automation before mutations
        run: python3 -m unittest discover -s .automation -p 'test_*.py'
      - name: Check credentials
        id: credentials
        run: |
          test -n "$CNB_AUTOMATION_TOKEN" || { echo 'Configure CNB_AUTOMATION_TOKEN before enabling controller'; exit 1; }
          git config user.name FlClash-Automation
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
      - name: Verify CNB integration permissions
        if: inputs.operation == 'preflight'
        run: python3 .automation/credentials.py
      - name: Notify new stable upstream release
        if: always() && steps.credentials.outcome == 'success' && (github.event.schedule == '17 */6 * * *' || inputs.operation == 'all' || inputs.operation == 'watch')
        run: python3 .automation/control.py watch
      - name: Bring CNB main up to GitHub main
        if: always() && steps.credentials.outcome == 'success' && inputs.operation != 'preflight'
        run: python3 .automation/control.py sync
      - name: Process owner approvals
        if: always() && steps.credentials.outcome == 'success' && (github.event.schedule == '0 * * * *' || inputs.operation == 'all' || inputs.operation == 'approvals')
        run: python3 .automation/control.py approvals
      - name: Reuse artifacts of stopped release builds
        if: always() && steps.credentials.outcome == 'success' && (github.event.schedule == '0 * * * *' || inputs.operation == 'all' || inputs.operation == 'scheduler')
        run: python3 .automation/scheduler.py
