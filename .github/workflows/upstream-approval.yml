# An owner comment on a bot Issue. This runs main's code, never a PR's; the comment text and the Issue title stay out of
# here, and control.py reads them through the API as data. The hourly pass in upstream.yaml covers a lost event.
name: Upstream approval
on:
  issue_comment:
    types: [created]
permissions:
  contents: write
  pull-requests: write
  issues: write
jobs:
  approval:
    if: github.event.issue.pull_request == null && github.event.comment.user.login == github.repository_owner && github.event.issue.user.login == 'github-actions[bot]'
    # On the job, not the workflow: a skipped run from someone else's comment must not take a place in this queue.
    concurrency:
      group: flclash-upstream-controller
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Test trusted automation before mutations
        run: python3 -m unittest discover -s .automation -p 'test_*.py'
      - name: Process the owner approval
        run: |
          git config user.name FlClash-Automation
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          python3 .automation/control.py approvals
