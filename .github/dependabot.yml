# Weekly, grouped and few at a time. Every PR goes through ci-ok and Dependency vulnerability scan, and the owner merges it.
#
# core/Clash.Meta: its own go.mod is not in this repository, so Dependabot cannot read it. `gitsubmodule` only moves the
# pinned commit, and `/core` updates the versions the build really uses. security_scan.py covers the whole resolved graph.
#
# pub: plugins/wifi_ssid has no external dependency. Indirect Go modules are left to security updates, because mihomo
# decides those versions and a weekly bump of all of them would mostly be noise.
version: 2
updates:
  - package-ecosystem: pub
    directories:
      - /
      - /plugins/code_forge
      - /plugins/proxy
      - /plugins/rust_api
      - /plugins/setup
      - /plugins/setup/setup_hooks
      - /plugins/tray
      - /plugins/window
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Shanghai
    open-pull-requests-limit: 2
    groups:
      version-updates:
        applies-to: version-updates
        patterns: ['*']
      security-updates:
        applies-to: security-updates
        patterns: ['*']
  - package-ecosystem: gomod
    directory: /core
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Shanghai
    open-pull-requests-limit: 1
    groups:
      version-updates:
        applies-to: version-updates
        patterns: ['*']
      security-updates:
        applies-to: security-updates
        patterns: ['*']
  - package-ecosystem: cargo
    directories:
      - /services/helper
      - /plugins/rust_api/rust
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Shanghai
    open-pull-requests-limit: 2
    groups:
      version-updates:
        applies-to: version-updates
        patterns: ['*']
      security-updates:
        applies-to: security-updates
        patterns: ['*']
  - package-ecosystem: gradle
    directories:
      - /android
      - /plugins/wifi_ssid/android
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Shanghai
    open-pull-requests-limit: 2
    groups:
      version-updates:
        applies-to: version-updates
        patterns: ['*']
      security-updates:
        applies-to: security-updates
        patterns: ['*']
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/setup-android-toolchain
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Shanghai
    open-pull-requests-limit: 1
    groups:
      version-updates:
        applies-to: version-updates
        patterns: ['*']
      security-updates:
        applies-to: security-updates
        patterns: ['*']
  - package-ecosystem: gitsubmodule
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Shanghai
    open-pull-requests-limit: 1
