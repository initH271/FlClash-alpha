# Weekly, grouped and few at a time. Every PR goes through ci-ok and Dependency vulnerability scan, and the owner merges it.
#
# core/Clash.Meta: its own go.mod is not in this repository, so Dependabot cannot read it. `/core` updates the versions the
# build really uses, and security_scan.py covers the whole resolved graph. There is deliberately no `gitsubmodule` block:
# it would move mihomo to the tip of its branch, ahead of the upstream release and around the owner's OK. The pinned commit
# only moves with an upstream upgrade.
#
# pub: plugins/wifi_ssid has no external dependency.
version: 2
updates:
  - package-ecosystem: pub
    directories:
      - /
      - /plugins/code_forge
      - /plugins/proxy
      - /plugins/rust_api
      - /plugins/setup
      - /plugins/setup/setup_hooks
      - /plugins/tray
      - /plugins/window
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Shanghai
    open-pull-requests-limit: 2
    groups:
      version-updates:
        applies-to: version-updates
        patterns: ['*']
      security-updates:
        applies-to: security-updates
        patterns: ['*']
  - package-ecosystem: gomod
    directory: /core
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Shanghai
    # Security updates only. A version update runs `go mod tidy`, which drops the indirect fix versions core/go.mod holds
    # for mihomo's dependencies, so versions fall back and the scan fails it every time. This limit does not apply to
    # security updates, which have their own fixed limit.
    open-pull-requests-limit: 0
    groups:
      security-updates:
        applies-to: security-updates
        patterns: ['*']
  - package-ecosystem: cargo
    directories:
      - /services/helper
      - /plugins/rust_api/rust
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Shanghai
    # Patch releases only: a group is all or nothing, so one breaking minor (rquickjs without Android bindings) sinks the
    # rest. `allow` rather than `ignore` because GitHub documents that allow's update-types never limit security updates.
    allow:
      - dependency-name: '*'
        update-types: ['version-update:semver-patch']
    open-pull-requests-limit: 2
    groups:
      version-updates:
        applies-to: version-updates
        patterns: ['*']
      security-updates:
        applies-to: security-updates
        patterns: ['*']
  - package-ecosystem: gradle
    directories:
      - /android
      - /plugins/wifi_ssid/android
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Shanghai
    open-pull-requests-limit: 2
    groups:
      version-updates:
        applies-to: version-updates
        patterns: ['*']
      security-updates:
        applies-to: security-updates
        patterns: ['*']
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/setup-android-toolchain
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Shanghai
    open-pull-requests-limit: 1
    groups:
      version-updates:
        applies-to: version-updates
        patterns: ['*']
      security-updates:
        applies-to: security-updates
        patterns: ['*']
